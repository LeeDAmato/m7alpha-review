<style>
/* M7Alpha session board: which Claude and Astra sessions need Lee, live.
   Rows come from session_board/watch_sessions.py on Lee's laptop. Only signed-in editors can read them; the database enforces it. */
:root {
  --teal: #479aa4; --teal-d: #2c6a72; --orange: #f19b1f;
  --ink: #111214; --ink-2: #4a5557; --ink-3: #7d8789; --line: #dfe6e6; --bg: #f5f7f6; --card: #fff;
  --ok: #1f8a5b; --ok-soft: #dff3ea; --warn: #b45d00; --warn-soft: #fdeed8; --err: #b8432f; --err-soft: #f8e2dd;
  --claude: #c2643c; --claude-soft: #f7e6dd; --astra: #2c6a72; --astra-soft: #e3f1f2;
  --shadow: 0 1px 2px rgba(17, 18, 20, .05), 0 6px 18px rgba(17, 18, 20, .05);
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.45; color: var(--ink); background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.top { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.top .in { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { height: 24px; display: block; }
.tag { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--teal-d); background: #e3f1f2; padding: 4px 10px; border-radius: 999px; }
.pulse { margin-left: auto; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--orange); } .dot.err { background: var(--err); }
main { max-width: 860px; margin: 0 auto; padding: 18px 16px 60px; display: grid; gap: 22px; }
h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; line-height: 1.2; }
h2 { margin: 0 0 8px; font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
.count { font-size: 12px; background: var(--orange); color: #fff; border-radius: 999px; padding: 1px 8px; letter-spacing: 0; }
.count.grey { background: #cfd8d8; color: var(--ink-2); }
.client { margin: 14px 0 6px; font-size: 15px; font-weight: 800; color: var(--ink); }
.client:first-of-type { margin-top: 0; }
.list { display: grid; gap: 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; gap: 6px; }
.card.approval { border-color: var(--err); box-shadow: inset 4px 0 0 var(--err), var(--shadow); }
.card.needs { box-shadow: inset 4px 0 0 var(--orange), var(--shadow); }
.head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.who { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; flex: none; }
.who.claude { color: var(--claude); background: var(--claude-soft); } .who.astra { color: var(--astra); background: var(--astra-soft); }
.title { font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ago { font-size: 12.5px; color: var(--ink-3); flex: none; }
.need { font-size: 16px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.recap { font-size: 13.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 13px; font-weight: 700; font-size: 14px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: linear-gradient(135deg, #63a9ad 0%, #3f8a91 35%, #2c6a72 100%); color: #fff; border-color: #2c6a72; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 12px; background: #fff; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
.row .title { font-weight: 600; flex: 1 1 160px; }
.row a { color: var(--teal-d); font-weight: 700; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; flex: none; }
.spin { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
details { background: transparent; }
summary { cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary h2 { margin: 0; }

details[open] summary h2::after { content: "Hide"; }
details .inner { margin-top: 10px; display: grid; gap: 6px; }
.search { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; background: #fff; }
.empty { background: #fff; border: 1px dashed #c8d3d2; border-radius: 14px; padding: 18px; text-align: center; color: var(--ink-2); }
.muted { color: var(--ink-3); font-size: 13.5px; }
.gate { max-width: 460px; margin: 10vh auto; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.field { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: #fff; font-size: 15px; }
.status { font-size: 14px; font-weight: 600; min-height: 1.3em; } .status.err { color: var(--err); }
.link { border: 0; background: none; padding: 0; color: var(--teal-d); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 14px; }
.banner.err { background: var(--err-soft); color: var(--err); }
.reply { display: grid; gap: 6px; flex-basis: 100%; margin-top: 4px; }
.reply textarea { width: 100%; min-height: 44px; max-height: 220px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fbfdfc; font: inherit; font-size: 14.5px; line-height: 1.4; }
.reply textarea:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px rgba(71,154,164,.18); background: #fff; }
.reply .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn.opt { border-color: var(--teal-d); color: var(--teal-d); }
.btn:disabled { opacity: .5; cursor: default; }
.rstatus { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.rstatus.ok { color: var(--ok); } .rstatus.err { color: var(--err); } .rstatus.wait { color: var(--warn); }
.hint { font-size: 12.5px; color: var(--ink-3); margin-left: auto; }
/* Dark background, glass panels (Lee, 24 Oct 2026). Overrides the light look above. */
:root {
  --ink: #eef4f4; --ink-2: #b9c8c9; --ink-3: #8a9c9e; --line: rgba(255,255,255,.12); --bg: #0b1214;
  --glass: rgba(255,255,255,.065); --glass-2: rgba(255,255,255,.1); --glass-line: rgba(255,255,255,.14);
  --ok: #4fd39a; --ok-soft: rgba(79,211,154,.14); --warn: #f5b450; --warn-soft: rgba(245,180,80,.14); --err: #ff7a66; --err-soft: rgba(255,122,102,.14);
  --claude: #f0a07c; --claude-soft: rgba(240,160,124,.16); --astra: #7fd1da; --astra-soft: rgba(127,209,218,.14);
  --shadow: 0 8px 32px rgba(0,0,0,.35);
  color-scheme: dark;
}
body { background: radial-gradient(520px 420px at 38% 18%, rgba(83,192,170,.42), transparent 70%),     /* glows sit behind the card column so the glass has colour to blur */
                    radial-gradient(480px 380px at 64% 48%, rgba(241,155,31,.26), transparent 70%),
                    radial-gradient(560px 460px at 40% 82%, rgba(71,154,164,.40), transparent 70%),
                    radial-gradient(900px 600px at 10% -10%, rgba(44,106,114,.35), transparent 60%), var(--bg);
       background-attachment: fixed; }
.top { background: rgba(11,18,20,.6); border-bottom: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); }
.logo { filter: brightness(1.15); }
.tag { color: #bfe7ec; background: rgba(127,209,218,.14); }
.card, .row, .panel, .empty, .search, .field {
  background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05) 55%, rgba(255,255,255,.03));
  border: 1px solid rgba(255,255,255,.18);
  -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), var(--shadow);
}
.card.needs { box-shadow: inset 4px 0 0 var(--orange), inset 0 1px 0 rgba(255,255,255,.08), var(--shadow); }
.card.approval { border-color: rgba(255,122,102,.5); box-shadow: inset 4px 0 0 var(--err), inset 0 1px 0 rgba(255,255,255,.08), var(--shadow); }
.row { box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.search, .field { color: var(--ink); }
.search::placeholder, .field::placeholder, .reply textarea::placeholder { color: var(--ink-3); }
.btn { background: rgba(255,255,255,.07); border-color: var(--glass-line); color: var(--ink); }
.btn:hover { border-color: rgba(255,255,255,.32); background: rgba(255,255,255,.12); }
.btn.primary { background: linear-gradient(135deg, #5fb6bd 0%, #3f8a91 45%, #2c6a72 100%); border-color: rgba(127,209,218,.5); color: #fff; }
.btn.opt { border-color: rgba(127,209,218,.55); color: #bfe7ec; }
.row a, .link { color: #9fdde4; }
.reply textarea { background: rgba(0,0,0,.25); border-color: var(--glass-line); color: var(--ink); }
.reply textarea:focus { background: rgba(0,0,0,.35); border-color: #7fd1da; box-shadow: 0 0 0 3px rgba(127,209,218,.18); }
.count.grey { background: rgba(255,255,255,.14); color: var(--ink-2); }
.client { color: #dfeaea; }
.empty { color: var(--ink-2); border-style: dashed; }
.banner { border: 1px solid rgba(245,180,80,.3); }
.banner.err { border-color: rgba(255,122,102,.3); }
:focus-visible { outline-color: #7fd1da; }
/* ---------- The wall (Lee, 24 Oct 2026): a 3D grid wall at an angle, one card per session that needs him,
   flat on the wall in a row; Next travels right along it. The wall turns away to the right (rotateY), and
   moving to a card slides the wall along its own length, so the cards ahead recede into the distance. */
.modes { display: flex; gap: 4px; background: rgba(255,255,255,.06); border: 1px solid var(--glass-line); border-radius: 999px; padding: 3px; }
.modes button { border: 0; background: none; color: var(--ink-2); font-weight: 700; font-size: 13px; padding: 5px 12px; border-radius: 999px; }
.modes button[aria-pressed="true"] { background: rgba(127,209,218,.18); color: #dff6f8; }
body.wall-mode { overflow: hidden; }
body.wall-mode main { max-width: none; padding: 0; }
.stage { position: fixed; inset: 57px 0 0 0; perspective: 1500px; perspective-origin: 50% 46%; overflow: hidden;
  background: radial-gradient(1200px 700px at 50% 40%, rgba(44,106,114,.28), transparent 70%), #0d1214; }
.pivot { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }   /* turns the wall around the middle of the screen */
.wall { position: absolute; left: 0; top: -1200px; height: 2400px; transform-style: preserve-3d;
  transition: transform .9s cubic-bezier(.65,.05,.25,1); }
.wall .grid { position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(rgba(83,192,170,.30) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(83,192,170,.30) 1.5px, transparent 1.5px);
  background-size: 96px 96px; background-position: -1px -1px;
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 22%, #000 78%, transparent 100%);
          mask-image: linear-gradient(180deg, transparent 0%, #000 22%, #000 78%, transparent 100%); }
.wall .floorline { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(127,224,201,.5) 8%, rgba(127,224,201,.5) 92%, transparent); box-shadow: 0 0 18px rgba(127,224,201,.45); }
.wcard { position: absolute; display: flex; flex-direction: column; gap: 12px; padding: 26px 28px 22px; border-radius: 22px;
  background: linear-gradient(160deg, rgba(22,34,37,.92), rgba(14,21,23,.94)); border: 1px solid rgba(255,255,255,.16);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(83,192,170,.08);
  transition: opacity .6s, filter .6s; }
.wcard.away { filter: brightness(.5) saturate(.6); cursor: pointer; }   /* dimmed, not faded: the card keeps its solid back */
.wcard.away * { pointer-events: none; }
.wcard .cdot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #efc319; box-shadow: 0 0 10px 2px rgba(239,195,25,.7); }
.wcard .cdot.tl { left: -5px; top: -5px; } .wcard .cdot.tr { right: -5px; top: -5px; } .wcard .cdot.bl { left: -5px; bottom: -5px; } .wcard .cdot.br { right: -5px; bottom: -5px; }
.wcard.approval { border-color: rgba(255,122,102,.55); }
.wcard.approval .cdot { background: #ff7a66; box-shadow: 0 0 10px 2px rgba(255,122,102,.7); }
.wtop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.wclient { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #7fe0c9; }
.wpos { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--ink-3); }
.wtitle { font-size: 15px; font-weight: 600; color: var(--ink-2); margin-top: -4px; }
.wneed { font-size: 27px; line-height: 1.25; font-weight: 800; letter-spacing: -.015em; color: #fff; }
.wneed .lab { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #f5b450; font-weight: 800; margin-bottom: 6px; }
.wbody { flex: 1 1 auto; min-height: 90px; overflow: auto; padding: 14px 16px; border-radius: 14px; background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.07);
  font-size: 14.5px; line-height: 1.55; color: #cfdcdc; }
.wbody h4 { margin: 12px 0 4px; font-size: 14.5px; color: #fff; } .wbody h4:first-child { margin-top: 0; }
.wbody p { margin: 0 0 9px; } .wbody ul { margin: 0 0 9px; padding-left: 20px; } .wbody li { margin: 2px 0; }
.wbody code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 5px; word-break: break-all; }

.wbody .tbl { font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: pre; overflow-x: auto; }
.wbody b { color: #fff; }
.wcard .reply { margin-top: 0; flex: 0 0 auto; }
.wcard .wfoot, .wcard .wtop, .wcard .wneed, .wcard .wtitle { flex: 0 0 auto; }

<body>
<header class="top"><div class="in">
  <img class="logo" src="assets/m7alpha-logo.png" alt="M7Alpha">
  <span class="tag">Sessions</span>
  <div class="modes" id="modes" hidden><button data-m="wall" aria-pressed="true">Cards</button><button data-m="list" aria-pressed="false">List</button></div>
  <div class="pulse" id="pulse"></div>
</div></header>
<main id="app"></main>

<script>
"use strict";
const CONFIG = { url: "https://johtcnbucfrolcmejmzm.supabase.co", key: "sb_publishable_WHgAfZzDbPralzbgEdVjXg_5p5CKTFU" };
const sb = supabase.createClient(CONFIG.url, CONFIG.key, { auth: { persistSession: true, detectSessionInUrl: true, flowType: "implicit" } });
const PHONE = matchMedia("(pointer: coarse)").matches;   // on a phone, the claude.ai link is the one that opens

const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) { if (kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return el;
}
const app = $("#app");
function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}

// ---------- state ----------
const S = { user: null, rows: new Map(), replies: new Map(), drafts: {}, openReply: new Set(), filter: "", open: false, live: "connecting", deferred: false,
  mode: "wall", cur: null, files: {}, advanceAfter: null };
try { S.mode = localStorage.getItem("board-mode") || "wall"; } catch (e) {}

// ---------- sign in ----------
async function start() {
  const { data } = await sb.auth.getSession();
  S.user = data.session?.user || null;
  if (!S.user) return renderSignIn();
  const ok = await sb.rpc("is_editor");
  if (ok.error || ok.data !== true) return renderNotEditor();
  await loadAll();
  subscribe();
}
sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_IN" && !S.user) start(); if (ev === "SIGNED_OUT") { S.user = null; renderSignIn(); } });

function renderSignIn(sentTo) {
  $("#pulse").replaceChildren();
  const email = h("input", { class: "field", type: "email", autocomplete: "email", placeholder: "you@m7alpha.com", "aria-label": "Email" });
  const status = h("div", { class: "status" });
  const send = async () => {
    const addr = email.value.trim(); if (!addr) return email.focus();
    status.className = "status"; status.textContent = "Sending…";
    const { error } = await sb.auth.signInWithOtp({ email: addr, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: false } });
    if (error) { status.className = "status err"; status.textContent = "Couldn't send the link: " + error.message; return; }
    renderSignIn(addr);
  };
  email.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  app.replaceChildren(h("div", { class: "gate" }, h("div", { class: "panel" },
    h("h1", { text: "Sign in to see your sessions" }),

function render(force) {
  if (!force && document.activeElement?.classList.contains("reply-text")) { S.deferred = true; renderPulse(); return; }   // never wipe a reply being typed
  S.deferred = false;
  const modes = $("#modes"); modes.hidden = false;
  modes.querySelectorAll("button").forEach((b) => { b.setAttribute("aria-pressed", String(b.dataset.m === S.mode)); b.onclick = () => { S.mode = b.dataset.m; try { localStorage.setItem("board-mode", S.mode); } catch (e) {} render(true); }; });
  document.body.classList.toggle("wall-mode", S.mode === "wall");
  if (S.mode === "wall") return renderWall();
  const searching = document.activeElement?.classList.contains("search");
  const laptop = renderPulse();
  const all = [...S.rows.values()];
  const f = S.filter.toLowerCase();
  const match = (r) => !f || (r.title + " " + r.client + " " + r.needs).toLowerCase().includes(f);
  const needs = all.filter((r) => groupOf(r) === "needs" && match(r));
  const busy = all.filter((r) => groupOf(r) === "busy" && match(r)).sort(newest);
  const quiet = all.filter((r) => groupOf(r) === "quiet" && match(r)).sort(newest);
  document.title = (needs.length ? `(${needs.length}) ` : "") + "M7Alpha Sessions";

  const search = h("input", { class: "search", type: "search", placeholder: "Find a session or client", value: S.filter, "aria-label": "Find a session or client",
    oninput: (e) => { S.filter = e.target.value; render(); } });

  const quietBox = h("details", { ontoggle: (e) => { S.open = e.currentTarget.open; } },
    h("summary", {}, h("h2", {}, "Nothing needed from you", h("span", { class: "count grey", text: quiet.length }))),
    h("div", { class: "inner" }, quiet.length ? byClient(quiet).map(([c, rs]) => [h("div", { class: "client", text: c }), rs.map((r) => line(r, false))]) : h("div", { class: "muted", text: "None." })));
  if (S.open) quietBox.open = true;

  app.replaceChildren(...[
    laptop === "err" ? h("div", { class: "banner", text: "Your laptop hasn't sent an update for a while (it may be asleep or off). The list shows the last known state." }) : null,
    h("div", {}, search),
    h("section", {},
      h("h2", {}, "Needs you", h("span", { class: "count" + (needs.length ? "" : " grey"), text: needs.length })),
      needs.length ? byClient(needs).map(([c, rs]) => [h("div", { class: "client", text: c }), h("div", { class: "list" }, rs.sort(newest).map(card))])
                   : h("div", { class: "empty", text: f ? "Nothing matches." : "Nothing needs you right now." })),
    busy.length ? h("section", {}, h("h2", {}, "Working now", h("span", { class: "count grey", text: busy.length })), h("div", { class: "list" }, busy.map((r) => line(r, true)))) : null,
    h("section", {}, quietBox),
    h("div", { class: "foot muted" }, h("span", { text: "Updates by itself. Done hides a row until that session finishes its next turn. " + (relayOn() ? "Replies to Claude sessions: relay on." : "Replies to Claude sessions: relay off, they wait until it is back.") }),
      h("button", { class: "link", text: "Sign out", onclick: () => sb.auth.signOut() }))].flat(Infinity).filter(Boolean));
  if (searching) { const s = $(".search"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

start();
</script>
</body>
</html>
