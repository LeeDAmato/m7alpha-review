<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>M7Alpha Review</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* M7Alpha review page. One page serves every client: ?c=<client link code>.
   Everything shown is fetched from Supabase when the page opens, so new rounds appear at the same link. */
:root {
  --teal: #479aa4; --teal-d: #2c6a72; --mint: #53c0aa; --yellow: #efc319; --orange: #f19b1f;
  --ink: #111214; --ink-2: #4a5557; --ink-3: #7d8789; --line: #dfe6e6; --card: #ffffff;
  --ok: #1f8a5b; --ok-soft: #dff3ea; --chg: #b45d00; --chg-soft: #fdeed8; --wait-soft: #eef2f2;
  --shadow: 0 1px 2px rgba(17, 18, 20, .05), 0 8px 24px rgba(17, 18, 20, .06);
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink);
  background-color: #fbfcfb;
  background-image:
    radial-gradient(48% 38% at 12% 0%, rgba(249, 222, 190, .65), transparent 70%),
    radial-gradient(42% 36% at 92% 4%, rgba(190, 232, 219, .75), transparent 70%),
    radial-gradient(46% 40% at 10% 96%, rgba(203, 228, 236, .7), transparent 70%),
    radial-gradient(44% 38% at 94% 92%, rgba(252, 240, 205, .75), transparent 70%);
  background-attachment: fixed; min-height: 100vh;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
.deco { position: fixed; right: -10px; bottom: -14px; width: 230px; pointer-events: none; z-index: 0; opacity: .9; }
main, header, footer { position: relative; z-index: 1; }

/* header */
.top { padding: 22px 0 6px; }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.logo { height: 34px; width: auto; display: block; }
.who { font-size: 14px; color: var(--ink-2); text-align: right; }
.who button { border: 0; background: none; color: var(--teal-d); font-weight: 600; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.four { display: flex; height: 5px; width: 160px; border-radius: 3px; overflow: hidden; }
.four i { flex: 1; }

/* intro */
.intro { padding: 34px 0 10px; display: grid; gap: 14px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--teal-d); }
h1 { font-size: clamp(32px, 6vw, 56px); line-height: 1.12; letter-spacing: -.025em; font-weight: 800; margin: 0; max-width: 16ch; }
h1:has(.hl) { line-height: 1.3; }
.lede { margin: 0; font-size: 18px; color: var(--ink-2); max-width: 54ch; }

/* the M7Alpha highlight (motion library T06) */
.hl { position: relative; padding: 0 .17em; margin: 0 .03em; white-space: nowrap;
  background: linear-gradient(90deg, rgba(71, 154, 164, .41), rgba(241, 155, 31, .41)) left center / 100% 74% no-repeat; }
.hl::before, .hl::after { content: ""; position: absolute; width: .375em; pointer-events: none; }
.hl::before { left: 0; top: -.13em; bottom: .165em; transform: translateX(-50%);
  background: radial-gradient(circle, #479aa4 64%, transparent 67%) top center / .375em .375em no-repeat,
              linear-gradient(#479aa4, #479aa4) center bottom / max(2px, .035em) calc(100% - .2em) no-repeat; }
.hl::after { right: 0; top: .165em; bottom: -.13em; transform: translateX(50%);
  background: radial-gradient(circle, #f19b1f 64%, transparent 67%) bottom center / .375em .375em no-repeat,
              linear-gradient(#f19b1f, #f19b1f) center top / max(2px, .035em) calc(100% - .2em) no-repeat; }
@media (prefers-reduced-motion: no-preference) {
  .hl.play { animation: hlfill .62s cubic-bezier(.65, 0, .25, 1) .08s both; }
  .hl.play::before { animation: hlpop .34s cubic-bezier(.3, 1.6, .5, 1) both; }
  .hl.play::after { animation: hlpop .42s cubic-bezier(.3, 1.7, .5, 1) .58s both; }
}
@keyframes hlfill { from { background-size: 0% 74%; } 28% { background-size: 28% 74%; } to { background-size: 100% 74%; } }
@keyframes hlpop { from { opacity: 0; transform: translateX(-50%) scale(.3); } to { opacity: 1; } }
.hl.play::after { animation-name: hlpop2; }
@keyframes hlpop2 { from { opacity: 0; transform: translateX(50%) scale(.3); } to { opacity: 1; transform: translateX(50%); } }

/* buttons: the two used on m7alpha.com */
.cta { display: inline-flex; align-items: center; gap: .6em; border-radius: 999px; font-weight: 700; line-height: 1;
  white-space: nowrap; padding: .42em .42em .42em 1.2em; border: 0; font-size: 16px; letter-spacing: -.01em; }
.cta .arr { width: 2em; height: 2em; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
.cta .arr svg { width: .9em; height: .9em; }
.cta.pill { background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 45%), linear-gradient(135deg, #63a9ad 0%, #3f8a91 35%, #2c6a72 100%);
  color: #fff; box-shadow: 0 .25em .6em rgba(44, 106, 114, .28); }
.cta.pill .arr { background: var(--yellow); color: var(--ink); }
.cta.white { background: #fff; color: var(--ink); border: 1px solid #dde3e3; box-shadow: 0 .15em .45em rgba(17, 18, 20, .07); }
.cta.white .arr { background: var(--teal-d); color: #fff; }
.cta:disabled { opacity: .55; cursor: default; }
.cta:not(:disabled):hover { transform: translateY(-1px); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* rounds, filters, progress */
.bar { display: grid; gap: 14px; padding: 26px 0 18px; }
.rounds, .chips { display: flex; flex-wrap: wrap; gap: 8px; }
.round { border: 1px solid var(--line); background: rgba(255,255,255,.8); border-radius: 14px; padding: 9px 14px; text-align: left; display: grid; gap: 1px; }
.round b { font-size: 15px; }
.round small { font-size: 12.5px; color: var(--ink-3); }
.round[aria-pressed="true"] { border-color: var(--teal-d); box-shadow: inset 0 0 0 1px var(--teal-d); background: #fff; }
.round .new { font-size: 11px; font-weight: 800; color: var(--teal-d); letter-spacing: .08em; text-transform: uppercase; }
.chip { border: 1px solid var(--line); background: rgba(255,255,255,.85); border-radius: 999px; padding: 6px 13px; font-size: 14px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.progress { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 14px; color: var(--ink-2); }
.progress b { color: var(--ink); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.note { background: rgba(255,255,255,.85); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; color: var(--ink-2); font-size: 15px; white-space: pre-wrap; }
.done { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; font-size: 20px; font-weight: 800; box-shadow: var(--shadow); }
.done .hl { line-height: 1.4; }

/* gallery */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding-bottom: 40px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow);
  display: flex; flex-direction: column; text-align: left; padding: 0; transition: transform .15s ease, box-shadow .15s ease; }
.card:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(17,18,20,.06), 0 14px 32px rgba(17,18,20,.09); }
.thumb { aspect-ratio: 4 / 5; background: #eef2f1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.thumb img, .thumb video { width: 100%; height: 100%; object-fit: contain; display: block; }
.thumb .play { position: absolute; width: 54px; height: 54px; border-radius: 50%; background: rgba(17,18,20,.6); color: #fff; display: flex; align-items: center; justify-content: center; }
.thumb .play svg { width: 26px; height: 26px; margin-left: 3px; }
.thumb .count { position: absolute; left: 10px; top: 10px; background: rgba(17,18,20,.72); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.card .body { padding: 14px 16px 16px; display: grid; gap: 6px; }
.card .t { font-weight: 700; font-size: 16px; line-height: 1.3; }
.card .g { font-size: 12.5px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.card .cap { font-size: 14px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; width: max-content; max-width: 100%; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.chg { background: var(--chg-soft); color: var(--chg); }
.badge.wait { background: var(--wait-soft); color: var(--ink-2); }
.meta { font-size: 13px; color: var(--ink-3); }

.empty, .gate { max-width: 560px; margin: 8vh auto; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 28px; box-shadow: var(--shadow); display: grid; gap: 14px; }
.empty h2, .gate h2 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.empty p, .gate p { margin: 0; color: var(--ink-2); }
.field { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 16px; background: #fff; }
.field:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px rgba(71,154,164,.2); }
footer { padding: 30px 0 60px; font-size: 13px; color: var(--ink-3); }
footer .wrap { display: grid; gap: 6px; }

/* story view: one piece at a time, like Instagram stories */
.story { position: fixed; inset: 0; z-index: 50; background: #111214; color: #fff; display: grid; grid-template-rows: auto 1fr; }
.story[hidden] { display: none; }
.s-top { padding: max(10px, env(safe-area-inset-top)) 14px 8px; display: grid; gap: 10px; }
.segs { display: flex; gap: 4px; }
.seg { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); border: 0; padding: 0; }
.seg.ok { background: #53c0aa; } .seg.chg { background: #f19b1f; }
.seg.on { background: #fff; box-shadow: 0 0 0 1px #fff; }
.s-head { display: flex; align-items: center; gap: 12px; }
.s-head .n { font-size: 13px; color: rgba(255,255,255,.7); font-weight: 600; white-space: nowrap; }
.s-head .rname { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.6); overflow: hidden; text-overflow: ellipsis; }
.s-head .t { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.iconbtn:hover { background: rgba(255,255,255,.22); }
.iconbtn svg { width: 20px; height: 20px; }
.s-body { display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
.stage { position: relative; display: flex; align-items: center; justify-content: center; padding: 8px 64px 18px; min-height: 0; overflow: hidden; touch-action: pan-y; }
.frame { position: relative; display: inline-block; line-height: 0; max-width: 100%; }
.frame img, .frame video { display: block; max-width: 100%; max-height: calc(100vh - 150px); max-height: calc(100dvh - 150px); width: auto; height: auto; border-radius: 6px; user-select: none; -webkit-user-drag: none; }
.frame svg.marks { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.frame.marking svg.marks { pointer-events: auto; cursor: crosshair; touch-action: none; }
.frame.marking { outline: 2px dashed rgba(241,155,31,.9); outline-offset: 4px; border-radius: 6px; }
.navbtn { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; }
.navbtn.prev { left: 12px; } .navbtn.next { right: 12px; }
.navbtn:disabled { opacity: .25; cursor: default; }
.panel { background: #fff; color: var(--ink); overflow-y: auto; padding: 20px 20px 40px; display: grid; gap: 16px; align-content: start; border-radius: 18px 0 0 0; }
.panel { grid-template-columns: minmax(0, 1fr); }
.panel .cta { white-space: normal; text-align: left; line-height: 1.2; max-width: 100%; }
.panel h2 { margin: 0; font-size: 22px; line-height: 1.25; letter-spacing: -.015em; }
.panel .cap { white-space: pre-wrap; font-size: 15px; color: var(--ink-2); background: #f6f8f7; border-radius: 12px; padding: 12px 14px; margin: 0; }
.mnote { border-left: 4px solid var(--yellow); background: #fdf6dc; border-radius: 4px 12px 12px 4px; padding: 10px 14px; display: grid; gap: 2px; font-size: 14.5px; white-space: pre-wrap; }
.mnote b { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.variants { display: flex; flex-wrap: wrap; gap: 6px; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 -8px; }
.decide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.dec { border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 6px; font-weight: 700; font-size: 14px; display: grid; justify-items: center; gap: 4px; line-height: 1.2; }
.dec svg { width: 22px; height: 22px; }
.dec[aria-pressed="true"][data-d="approve"] { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.dec[aria-pressed="true"][data-d="change"] { border-color: var(--chg); background: var(--chg-soft); color: var(--chg); }
.dec[aria-pressed="true"][data-d="comment"] { border-color: var(--teal-d); background: #e3f1f2; color: var(--teal-d); }
.options { display: grid; gap: 8px; }
.opt { border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 14px; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: start; }
.opt b { font-size: 15px; }
.opt .opttext { grid-column: 1 / -1; white-space: pre-wrap; font-size: 14.5px; color: var(--ink-2); }
.opt .tick { width: 22px; height: 22px; color: var(--line); grid-row: 1; grid-column: 2; }
.opt .tick svg { width: 22px; height: 22px; }
.opt[aria-pressed="true"] { border-color: var(--teal-d); background: #e3f1f2; }
.opt[aria-pressed="true"] .tick { color: var(--teal-d); }
.decide.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
textarea.field { min-height: 96px; resize: vertical; line-height: 1.45; }
.tools { border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 10px; background: #f8faf9; }
.tools[hidden] { display: none; }
.trow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tool { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 6px 9px; font-size: 13px; font-weight: 600; display: inline-flex; gap: 5px; align-items: center; }
.tool svg { width: 16px; height: 16px; }
.tool[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.tool:disabled { opacity: .4; cursor: default; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.pins { display: grid; gap: 6px; }
.pinrow { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; }
.pinrow .num { width: 26px; height: 26px; border-radius: 50%; background: var(--orange); color: #fff; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.pinrow input { padding: 8px 10px; font-size: 14px; }
.pinrow button { border: 0; background: none; color: var(--ink-3); font-size: 13px; text-decoration: underline; }
.hint { font-size: 13px; color: var(--ink-3); margin: 0; }
.send { display: grid; gap: 8px; }
.status { font-size: 14px; font-weight: 600; min-height: 1.4em; }
.status.err { color: #b8432f; } .status.ok { color: var(--ok); }
.history { display: grid; gap: 10px; }
.fb { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; font-size: 14px; }
.fb .h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.fb .h b { font-size: 14.5px; }
.fb p { margin: 0; white-space: pre-wrap; color: var(--ink-2); }
.fb ol { margin: 0; padding-left: 20px; color: var(--ink-2); }
.fb .old { font-size: 12px; font-weight: 700; color: var(--ink-3); background: var(--wait-soft); padding: 2px 8px; border-radius: 999px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--teal-d); font-weight: 700; font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; width: max-content; }

/* dialogs and notices */
.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 90;
  background: var(--ink); color: #fff; border-radius: 999px; padding: 10px 10px 10px 18px; display: flex; gap: 12px; align-items: center; box-shadow: 0 8px 30px rgba(0,0,0,.25); max-width: calc(100vw - 32px); font-size: 15px; font-weight: 600; }
.toast[hidden] { display: none; }
.toast .cta { font-size: 14px; }
.modal { position: fixed; inset: 0; z-index: 95; background: rgba(17,18,20,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal .gate { margin: 0; width: 100%; }

@media (max-width: 900px) {
  .s-body { grid-template-columns: 1fr; grid-template-rows: auto auto; overflow-y: auto; }
  .story { grid-template-rows: auto minmax(0, 1fr); }
  .stage { padding: 4px 12px 14px; min-height: 52vh; }
  .frame img, .frame video { max-height: 62vh; max-height: 62dvh; }
  .navbtn { display: none; }
  .panel { border-radius: 18px 18px 0 0; overflow: visible; }
  .deco { width: 150px; }
}
@media (max-width: 520px) {
  .logo { height: 26px; }
  .lede { font-size: 16.5px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .card .body { padding: 10px 11px 12px; }
  .card .t { font-size: 14.5px; }
  .card .cap { display: none; }
  .badge { font-size: 12px; padding: 3px 8px; }
}
</style>
</head>

// ---------- talking to the review store ----------
async function rpc(fn, args) {
  const r = await fetch(`${CONFIG.url}/rest/v1/rpc/${fn}`, {
    method: "POST", cache: "no-store",
    headers: { apikey: CONFIG.key, "Content-Type": "application/json" },
    body: JSON.stringify(args),
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
const mediaUrl = (path) => `${CONFIG.url}/storage/v1/object/public/${CONFIG.bucket}/${path.split("/").map(encodeURIComponent).join("/")}`;

// ---------- state ----------
const params = new URLSearchParams(location.search);
const S = {
  code: (params.get("c") || location.hash.replace(/^#/, "") || "").trim(),
  pass: null, data: null, roundId: null, group: "all",
  story: -1, variant: {}, marking: false, tool: "pen", color: "#f19b1f", width: 8,
  shown: new Set(),            // feedback ids whose marks are shown on the artwork
  stamp: null, me: store.get("m7r-name", ""), sending: false,
};
S.pass = sess.get("m7r-pass:" + S.code);
const draftKey = (it) => `m7r-draft:${S.code}:${it.id}:v${it.version}`;

// rounds run newest first, so the "next" round is the one after the current one in the list

function prevRound() { const rs = rounds(), i = rs.findIndex((r) => r.id === currentRound()?.id); return i > 0 ? rs[i - 1] : null; }
function roundDone(r) { return !!r && r.items.length > 0 && r.items.every((i) => statusOf(i).kind !== "wait"); }
function openRound(r, inStory, atEnd) {
  S.roundId = r.id; S.group = "all"; S.marking = false;
  if (!inStory) { renderApp(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  const first = r.items.findIndex((i) => statusOf(i).kind === "wait");
  S.story = atEnd ? r.items.length - 1 : Math.max(0, first); renderApp(); renderStory();
}

  return S.group === "all" ? r.items : r.items.filter((i) => i.group === S.group);
}
// The item's standing for its CURRENT version: the latest approve/change decision on that version.
function statusOf(item) {
  const fb = (item.feedback || []).filter((f) => f.item_version === item.version && f.decision !== "comment");
  const last = fb[fb.length - 1];
  return last ? { kind: last.decision, by: last.reviewer, at: last.created_at, choice: last.choice } : { kind: "wait" };
}

  const st = statusOf(item);
  if (st.kind === "approve") return h("span", { class: "badge ok", text: "Approved by " + st.by });
  if (st.kind === "change") return h("span", { class: "badge chg", text: "Changes asked by " + st.by });
  if (st.kind === "choose") return h("span", { class: "badge ok", text: `${st.by} picked “${optionLabel(item, st.choice)}”` });
  return h("span", { class: "badge wait", text: "Waiting for a look" });
}

// ---------- loading ----------
async function load({ quiet = false } = {}) {
  if (!S.code) return renderNoLink();
  if (!quiet) renderLoading();
  let res;
  try { res = await rpc("get_review", { p_code: S.code, p_passcode: S.pass }); }
  catch (e) { if (!quiet) renderError(); return false; }
  if (res.error === "not_found") return renderNoLink(true);
  if (res.error === "passcode") return renderPasscode(res.client, !!S.pass);
  S.data = res; S.stamp = res.stamp;
  if (!rounds().some((r) => r.id === S.roundId)) S.roundId = rounds()[0]?.id || null;
  document.title = `${res.client.name} · M7Alpha Review`;
  renderApp();
  if (S.story >= 0) renderStory();
  // ?p=<piece id> opens straight on that piece (once per visit)
  const want = params.get("p");
  if (want && !S.deepDone) {
    S.deepDone = true;
    const r = rounds().find((ro) => ro.items.some((i) => i.id.startsWith(want)));
    if (r) { S.roundId = r.id; S.group = "all"; renderApp(); openStory(r.items.findIndex((i) => i.id.startsWith(want))); }
  }
  return true;
}

async function poll() {
  if (!S.data || document.hidden) return;
  try {
    const stamp = await rpc("review_stamp", { p_code: S.code, p_passcode: S.pass });
    if (stamp && stamp !== S.stamp) {
      showToast("New work has been added.", "Show me", async () => { hideToast(); const before = rounds()[0]?.id; await load({ quiet: true }); if (rounds()[0]?.id !== before) { S.roundId = rounds()[0]?.id; S.group = "all"; renderApp(); } });
    }
  } catch {}
}
setInterval(poll, POLL_MS);

// ---------- story view ----------
const story = $("#story");

  S.story = Math.max(0, Math.min(i, visibleItems().length - 1)); S.marking = false;
  story.hidden = false; document.body.style.overflow = "hidden";
  renderStory();
  history.pushState({ story: true }, "");
}
function closeStory(fromHistory) {
  if (S.story < 0) return;

}

  if (!canMark) panel.append(h("p", { class: "hint", text: "Drawing works on pictures. For videos, please write a note." }));
  if (S.marking) {
    const toolList = [["pen", "Pen"], ["arrowtool", "Arrow"], ["line", "Line"], ["rect", "Box"], ["ellipse", "Circle"], ["pin", "Pin a note"]];
    tools.append(
      h("div", { class: "trow" }, toolList.map(([k, label]) => h("button", { type: "button", class: "tool", "aria-pressed": String(S.tool === k), onclick: () => { S.tool = k; renderStory(); } }, h("span", { html: ICON[k] }), label))),
      h("div", { class: "trow" },
        ["#f19b1f", "#e03131", "#479aa4", "#efc319", "#ffffff", "#111214"].map((c) => h("button", { type: "button", class: "sw", style: `background:${c}`, "aria-label": "Colour " + c, "aria-pressed": String(S.color === c), onclick: () => { S.color = c; renderStory(); } })),
        h("span", { style: "width:8px" }),
        [[4, "Thin"], [8, "Medium"], [14, "Thick"]].map(([w, label]) => h("button", { type: "button", class: "tool", "aria-pressed": String(S.width === w), onclick: () => { S.width = w; renderStory(); }, text: label }))),
      h("div", { class: "trow" },
        h("button", { type: "button", class: "tool", text: "Undo", onclick: () => undo(it, v) }),
        h("button", { type: "button", class: "tool", text: "Redo", onclick: () => redo(it, v) }),
        h("button", { type: "button", class: "tool", text: "Clear my drawing", onclick: () => { const dr = getDraft(it); const m = dr.marks[v.id]; if (!m || (!m.strokes.length && !m.pins.length)) return; if (!confirm("Clear your drawing on this version?")) return; undoStacks[it.id + v.id] = [m]; dr.marks[v.id] = { strokes: [], pins: [] }; putDraft(it, dr); renderStory(); } })),
      h("p", { class: "hint", text: S.tool === "pin" ? "Tap the artwork where you want a note. Then type it below." : "Draw with your finger, pen or mouse. Arrows and swipes are paused while you draw." }));
    panel.append(tools);
  }
  const pins = draftMarks(it, v).pins;
  if (pins.length) {
    panel.append(h("div", { class: "pins" }, pins.map((p, i) => {
      const inp = h("input", { class: "field", value: p.text || "", placeholder: "Note for pin " + (i + 1), "aria-label": "Note for pin " + (i + 1) });
      inp.addEventListener("input", () => { const dr = getDraft(it); dr.marks[v.id].pins[i].text = inp.value; putDraft(it, dr); updateSend(); });
      return h("div", { class: "pinrow" }, h("span", { class: "num", text: i + 1 }), inp,
        h("button", { type: "button", text: "Remove", onclick: () => { const dr = getDraft(it); dr.marks[v.id].pins.splice(i, 1); putDraft(it, dr); renderStory(); } }));
    })));
  }

  // send
  const status = h("div", { class: "status", role: "status" });
  const sendBtn = ctaBtn("Send to M7Alpha", "pill", () => send(it, status, sendBtn));
  const nr = nextRound();
  panel.append(h("div", { class: "send" }, h("div", { class: "actions" }, sendBtn,
    S.story < items.length - 1 ? ctaBtn("Next", "white", () => go(1)) : nr ? ctaBtn("Next round: " + nr.title, "white", () => openRound(nr, true)) : null), status));
  function updateSend() { sendBtn.disabled = S.sending || !canSend(it); }
  updateSend();

  // earlier notes on this piece
  const fbs = [...it.feedback].reverse();
  if (fbs.length) {
    panel.append(h("div", { class: "label", text: "Notes so far" }), h("div", { class: "history" }, fbs.map((f) => {
      const m = f.marks || {}, hasMarks = (m.strokes?.length || 0) + (m.pins?.length || 0) > 0;
      const variantLabel = it.media.find((x) => x.id === f.variant_id)?.label;
      return h("div", { class: "fb" },
        h("div", { class: "h" }, h("b", { text: f.reviewer }), h("span", { class: "badge " + DECISION[f.decision].cls, text: f.decision === "choose" ? `Picked “${optionLabel(it, f.choice)}”` : DECISION[f.decision].past }),
          h("span", { class: "meta", text: fmtDate(f.created_at) + (variantLabel && it.media.length > 1 ? " · " + variantLabel : "") }),
          f.item_version !== it.version ? h("span", { class: "old", text: "On version " + f.item_version }) : null),
        f.comment ? h("p", { text: f.comment }) : null,
        m.pins?.length ? h("ol", {}, m.pins.map((p) => h("li", { text: p.text || "(no words)" }))) : null,
        hasMarks && f.item_version === it.version ? h("button", { type: "button", class: "linkbtn", text: S.shown.has(f.id) ? "Hide drawing" : "Show drawing on the artwork",
          onclick: () => { S.shown.has(f.id) ? S.shown.delete(f.id) : S.shown.add(f.id); if (f.variant_id && f.variant_id !== v.id) S.variant[it.id] = f.variant_id; renderStory(); } }) : null);
    })));
  }

  const body = h("div", { class: "s-body" }, stage, panel);
  story.replaceChildren(top, body);
  S.redraw = () => drawMarks(svg, it, v, W, H);
  mediaEl?.addEventListener(v.type === "video" ? "loadedmetadata" : "load", S.redraw);
  S.redraw();
}

function canSend(it) {
  const d = getDraft(it);
  const hasMarks = Object.values(d.marks || {}).some((m) => m.strokes.length || m.pins.length);
  if (d.decision === "approve" || (d.decision === "choose" && d.choice)) return true;
  return !!(d.comment?.trim() || hasMarks);
}

// ---------- drawing ----------
function wireStage(stage, frame, svg, it, v, W, H) {
  // navigation by swipe (not while drawing)
  let sx = null, sy = null;
  stage.addEventListener("touchstart", (e) => { if (S.marking) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener("touchend", (e) => {
    if (S.marking || sx == null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) go(dx < 0 ? 1 : -1);
  });
  // tapping the left or right edge of the picture, like stories
  frame.addEventListener("click", (e) => {
    if (S.marking || e.target.closest("video")) return;
    const r = frame.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
    if (x < .3) go(-1); else if (x > .7) go(1);
  });
  if (!S.marking) return;
  let stroke = null;
  const pt = (e) => { const r = svg.getBoundingClientRect(); return [Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))]; };
  svg.addEventListener("pointerdown", (e) => {
    e.preventDefault(); svg.setPointerCapture(e.pointerId);
    const p = pt(e);
    if (S.tool === "pin") {
      const dr = getDraft(it); dr.marks[v.id] ??= { strokes: [], pins: [] };
      dr.marks[v.id].pins.push({ x: +p[0].toFixed(4), y: +p[1].toFixed(4), text: "" });
      putDraft(it, dr); undoStacks[it.id + v.id] = [];
      renderStory();
      const inputs = story.querySelectorAll(".pinrow input"); inputs[inputs.length - 1]?.focus();
      return;
    }
    stroke = { tool: S.tool === "arrowtool" ? "arrow" : S.tool, color: S.color, width: S.width, points: [p] };
  });
  svg.addEventListener("pointermove", (e) => {
    if (!stroke) return;
    const p = pt(e);
    if (stroke.tool === "pen") { const last = stroke.points[stroke.points.length - 1]; if (Math.hypot((p[0] - last[0]) * W, (p[1] - last[1]) * H) > 3) stroke.points.push(p); }
    else stroke.points[1] = p;
    drawMarks(svg, it, v, W, H, stroke);
  });
  const end = () => {
    if (!stroke) return;
    const s = stroke; stroke = null;
    if (s.tool !== "pen" && s.points.length < 2) { drawMarks(svg, it, v, W, H); return; }
    s.points = s.points.map((q) => [+q[0].toFixed(4), +q[1].toFixed(4)]);
    const dr = getDraft(it); dr.marks[v.id] ??= { strokes: [], pins: [] };
    dr.marks[v.id].strokes.push(s); putDraft(it, dr); undoStacks[it.id + v.id] = [];
    drawMarks(svg, it, v, W, H);
    const btn = story.querySelector(".send .cta.pill"); if (btn) btn.disabled = S.sending || !canSend(it);
  };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);
}
function undo(it, v) {
  const dr = getDraft(it), m = dr.marks[v.id]; if (!m) return;
  const k = it.id + v.id; undoStacks[k] ??= [];
  if (m.strokes.length) { undoStacks[k].push({ stroke: m.strokes.pop() }); putDraft(it, dr); renderStory(); }
}
function redo(it, v) {
  const k = it.id + v.id, st = undoStacks[k]; if (!st?.length) return;
  const top = st.pop(), dr = getDraft(it);
  if (top.stroke) { dr.marks[v.id] ??= { strokes: [], pins: [] }; dr.marks[v.id].strokes.push(top.stroke); }
  else if (top.strokes) dr.marks[v.id] = top;            // undoing "Clear my drawing"
  putDraft(it, dr); renderStory();
}
function paintStroke(g, s, W, H) {
  const sw = s.width * W / 1080, P = s.points.map((q) => [q[0] * W, q[1] * H]);
  const common = { stroke: s.color, "stroke-width": sw, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" };
  const shadow = { ...common, stroke: "rgba(0,0,0,.35)", "stroke-width": sw + 2 * W / 1080 };
  const shape = (attrs) => { if (s.color === "#ffffff") g.append(sv(attrs.tag, { ...attrs.a, ...shadow })); g.append(sv(attrs.tag, { ...attrs.a, ...common })); };
  const [a, b] = [P[0], P[P.length - 1]];
  if (s.tool === "pen") shape({ tag: "polyline", a: { points: (P.length === 1 ? [a, [a[0] + .1, a[1]]] : P).map((q) => q.join(",")).join(" ") } });
  else if (s.tool === "line") shape({ tag: "line", a: { x1: a[0], y1: a[1], x2: b[0], y2: b[1] } });
  else if (s.tool === "rect") shape({ tag: "rect", a: { x: Math.min(a[0], b[0]), y: Math.min(a[1], b[1]), width: Math.abs(b[0] - a[0]), height: Math.abs(b[1] - a[1]), rx: 4 * W / 1080 } });
  else if (s.tool === "ellipse") shape({ tag: "ellipse", a: { cx: (a[0] + b[0]) / 2, cy: (a[1] + b[1]) / 2, rx: Math.abs(b[0] - a[0]) / 2, ry: Math.abs(b[1] - a[1]) / 2 } });
  else if (s.tool === "arrow") {
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), len = Math.max(26 * W / 1080, sw * 3.2);
    const head = `${b[0] - len * Math.cos(ang - .5)},${b[1] - len * Math.sin(ang - .5)} ${b[0]},${b[1]} ${b[0] - len * Math.cos(ang + .5)},${b[1] - len * Math.sin(ang + .5)}`;
    shape({ tag: "line", a: { x1: a[0], y1: a[1], x2: b[0], y2: b[1] } });
    shape({ tag: "polyline", a: { points: head } });
  }
}
function paintPins(g, pins, W, H, fill, ps) {
  const r = 13 * ps;          // ps = image pixels per screen pixel, so pins stay the same size on screen
  pins.forEach((p, i) => {
    g.append(sv("circle", { cx: p.x * W, cy: p.y * H, r, fill, stroke: "#fff", "stroke-width": 2 * ps }));
    const t = sv("text", { x: p.x * W, y: p.y * H, fill: "#fff", "font-size": 13 * ps, "font-weight": 800, "text-anchor": "middle", "dominant-baseline": "central", "font-family": "Plus Jakarta Sans, sans-serif" });
    t.textContent = String(i + 1); g.append(t);
  });
}
function drawMarks(svg, it, v, W, H, live) {
  svg.replaceChildren();
  if (!v) return;
  const shown = svg.getBoundingClientRect().width, ps = shown > 0 ? W / shown : W / 400;
  // earlier notes the viewer chose to show, in teal pins
  it.feedback.filter((f) => S.shown.has(f.id) && f.variant_id === v.id && f.marks).forEach((f) => {
    const g = sv("g", { opacity: .9 }); (f.marks.strokes || []).forEach((s) => paintStroke(g, s, W, H)); paintPins(g, f.marks.pins || [], W, H, "#2c6a72", ps); svg.append(g);
  });
  const m = draftMarks(it, v), g = sv("g", {});
  m.strokes.forEach((s) => paintStroke(g, s, W, H));
  if (live) paintStroke(g, live, W, H);
  paintPins(g, m.pins, W, H, "#f19b1f", ps);
  svg.append(g);
}

// ---------- sending ----------
async function askName(force) {
  if (S.me && !force) return S.me;
  const modal = $("#modal");
  return new Promise((resolve) => {
    const input = h("input", { class: "field", autocomplete: "name", placeholder: "Your name", value: S.me || "", "aria-label": "Your name" });
    const done = (val) => { modal.hidden = true; modal.replaceChildren(); resolve(val); };
    const ok = () => { const n = input.value.trim().slice(0, 80); if (!n) { input.focus(); return; } S.me = n; store.set("m7r-name", n); renderWho(); done(n); };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") ok(); if (e.key === "Escape") done(null); });
    modal.replaceChildren(h("div", { class: "gate", role: "dialog", "aria-modal": "true", "aria-label": "Your name" },
      h("h2", { text: "What's your name?" }), h("p", { text: "So we know who said what." }), input,
      h("div", { class: "actions" }, ctaBtn("Save", "pill", ok), h("button", { type: "button", class: "linkbtn", text: "Cancel", onclick: () => done(null) }))));
    modal.hidden = false; input.focus();
  });
}
async function send(it, status, btn) {
  if (S.sending || !canSend(it)) return;
  const name = await askName(false); if (!name) return;
  const d = getDraft(it), v = variantOf(it);
  const decision = d.decision || "comment";
  // one note for the version on screen (with the decision and comment), plus one per other version the viewer drew on
  const jobs = [{ variant: v.id, decision, comment: d.comment || "", marks: d.marks[v.id] }];
  for (const [vid, m] of Object.entries(d.marks || {})) if (vid !== v.id && (m.strokes.length || m.pins.length)) jobs.push({ variant: vid, decision: "comment", comment: "", marks: m });
  S.sending = true; btn.disabled = true; status.className = "status"; status.textContent = "Sending…";
  try {
    for (const j of jobs) {
      const marks = j.marks && (j.marks.strokes.length || j.marks.pins.length) ? j.marks : null;
      const res = await rpc("submit_feedback", { p_code: S.code, p_passcode: S.pass, p_item_id: it.id, p_item_version: it.version, p_variant_id: j.variant, p_reviewer: name, p_decision: j.decision, p_comment: j.comment, p_marks: marks, p_choice: j.decision === "choose" ? d.choice : null });
      if (res.error === "stale") { status.className = "status err"; status.textContent = "This piece was just updated. We've loaded the new version. Please have another look."; S.sending = false; await load({ quiet: true }); return; }
      if (!res.ok) throw new Error(res.error || "not saved");
      if (j === jobs[0]) { d.decision = null; d.comment = ""; d.choice = null; }
      delete d.marks[j.variant]; putDraft(it, d);
    }
    store.set(draftKey(it), null);
    S.sending = false; S.marking = false;
    const wasLast = S.story === visibleItems().length - 1;
    await load({ quiet: true });          // read it back from the store, so what you see is what was saved
    const st = story.querySelector(".status");
    if (st) { st.className = "status ok"; st.textContent = `Sent. Thank you, ${name}!`; }
    const nr = nextRound();
    if (roundDone(currentRound()) && nr) {
      if (st) st.textContent = `Sent. That's this round done, thank you! Next: ${nr.title}.`;
      setTimeout(() => { if (S.story >= 0) openRound(nr, true); }, 1600);
    } else if ((decision === "approve" || decision === "choose") && !wasLast) setTimeout(() => { if (S.story >= 0) go(1); }, 700);
  } catch (e) {
    S.sending = false; btn.disabled = false;
    status.className = "status err"; status.textContent = "That didn't send. Please check your connection and try again. Your note is kept here.";
  }
}

// ---------- toast ----------
const toast = $("#toast");
function showToast(msg, action, fn) { toast.replaceChildren(h("span", { text: msg }), action ? ctaBtn(action, "pill", fn) : null); toast.hidden = false; }
function hideToast() { toast.hidden = true; }

// ---------- keys ----------
document.addEventListener("keydown", (e) => {
  if (S.story < 0 || !$("#modal").hidden) return;
  if (e.target.closest?.("input, textarea, select")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "Escape") { if (S.marking) { S.marking = false; renderStory(); } else closeStory(); }
});

load();
</script>
</body>
</html>
